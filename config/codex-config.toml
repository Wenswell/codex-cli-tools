model_provider = "codex"
personality = "pragmatic" # Codex 交流和执行风格
web_search = "live"
model_reasoning_effort = "medium" # 默认推理强度：low/medium/high/xhigh
project_doc_fallback_filenames = ["CLAUDE.md"] # AGENTS.md 找不到时，继续查找这些项目文档
developer_instructions = "开发原则：1.git项目中及时提交commit，开始修改前、每一轮修改结束后都保证工作区clean\n2.默认不考虑任何兼容性问题，保持整洁；默认允许破坏性更新，防止留下历史包袱\n3.应该尽可能探索、提出、采用常见方案、业内最佳实践\n4.禁止实施兜底性方案，有问题应寻找更优方案/更好做法\n5.强调：禁止为解决问题而使用工程兜底，永远寻求更理想的做法\n6.重复：禁止为了满足用户需求自己造轮子，应该先去寻找常见解法\n7.面向文档，及时同步、更新、精简文档以及项目结构，防止平铺大量文件\n8.语言简练、结构化、平实朴素，禁止拟人拟物性描述如禁止打、落等\n9.边界不清需求不明确等情况应先明确向用户指出请求明确"

approvals_reviewer = "user" # 审批交给用户确认
service_tier = "default" # 服务档位，fast 优先速度
model = "gpt-6.1-sol" # 默认使用的模型

suppress_unstable_features_warning = true # 隐藏实验功能警告

model_context_window=210000 # codex默认95%压缩上下文
model_auto_compact_token_limit=200000

[model_providers.codex] # 默认名为 codex 的模型提供商配置
name = "OpenAI" # 提供商名称
base_url = "http://127.0.0.1:4610"
wire_api = "responses" # 使用 Responses API 协议
requires_openai_auth = true # 需要 OpenAI 风格认证
request_max_retries = 14 # 普通 HTTP 请求最大重试次数
stream_max_retries = 15 # 流式响应最大重试次数
stream_idle_timeout_ms = 300000 # 流式响应空闲超时，单位毫秒

[features] # 功能开关，--enable xxx 等价于 features.xxx = true
hooks = true # 启用生命周期 hooks
enable_fanout = true # 启用任务并行分发
default_mode_request_user_input = true # 默认模式启用结构化提问工具
goals = true # 启用目标跟踪能力
shell_tool = true # 启用 shell 工具，默认 true
apply_patch_freeform = true # 启用自由格式 apply_patch 工具，默认 false
shell_snapshot = true # 启用 shell 快照功能，默认 false
undo = true # 启用 undo 功能，默认 true
unified_exec = true # 使用统一 PTY 执行工具
multi_agent = true # 启用多代理功能开关
steer = true # 启用 steer 能力
prevent_idle_sleep = true # 防止任务运行时系统空闲睡眠
collaboration_modes = true # 启用协作模式能力
fast_mode = false # 启用快速模式
image_detail_original = true # 允许按原始细节读取图片
memories = false # 启用记忆能力

[agents] # 子代理全局配置
max_threads = 9 # 最大并行代理线程数
max_depth = 2 # 子代理递归派生最大深度

[tui] # 终端 UI 配置
show_tooltips = false # 是否显示工具提示
status_line = ["model-with-reasoning", "project-name", "branch-changes", "run-state", "context-remaining", "total-output-tokens", "context-window-size"]
status_line_use_colors = true
session_picker_view = "dense"
screen_reader_detection_done = true

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

