model_provider = "codex" # 默认模型提供商，对应 [model_providers.codex]
personality = "pragmatic" # Codex 交流和执行风格
model_reasoning_effort = "medium" # 默认推理强度：low/medium/high/xhigh
disable_response_storage = true # 禁止服务端保存响应内容
network_access = "enabled" # 允许联网
project_doc_fallback_filenames = ["CLAUDE.md"] # AGENTS.md 找不到时，继续查找这些项目文档
developer_instructions = "开发原则：\n1.尽可能多使用subAgent来辅助/加速\n2.默认不考虑任何兼容性问题，保持整洁\n3.允许破坏性更新，防止留下历史包袱\n4.应该尽一切可能探索、提出、采用常见方案、业内最佳实践\n5.禁止实施任何兜底性方案，有问题应寻找更优方案/更好做法\n6.强调：禁止为解决问题而使用工程兜底，永远寻求更理想的做法\n7.禁止为了满足用户需求自己造轮子，应该先去寻找常见解法\n7.每一轮修改结束后都及时提交commit\n8.面向文档，及时同步、更新文档\n9.语言简练、结构化、平实朴素，禁止拟人拟物性描述如打、落等\n10.边界不清需求不明确等情况应先明确向用户指出请求明确。"

approvals_reviewer = "user" # 审批交给用户确认
service_tier = "fast" # 服务档位，fast 优先速度
model = "gpt-5.5" # 默认使用的模型

suppress_unstable_features_warning = true # 隐藏实验功能警告

[model_providers.codex] # 默认名为 codex 的模型提供商配置
name = "OpenAI" # 提供商名称
base_url = "https://codex.ciii.club" # API 基础地址
wire_api = "responses" # 使用 Responses API 协议
requires_openai_auth = true # 需要 OpenAI 风格认证
request_max_retries = 20 # 普通 HTTP 请求最大重试次数
stream_max_retries = 20 # 流式响应最大重试次数
stream_idle_timeout_ms = 600000 # 流式响应空闲超时，单位毫秒

[features] # 功能开关，--enable xxx 等价于 features.xxx = true
hooks = true # 启用生命周期 hooks
enable_fanout = true # 启用任务并行分发
default_mode_request_user_input = true # 默认模式启用结构化提问工具
goals = true # 启用目标跟踪能力
shell_tool = true # 启用 shell 工具，默认 true
apply_patch_freeform = true # 启用自由格式 apply_patch 工具，默认 false
shell_snapshot = true # 启用 shell 快照功能，默认 false
undo = true # 启用 undo 功能，默认 true
unified_exec = true # 使用统一 PTY 执行工具
multi_agent = true # 启用多代理功能开关
steer = true # 启用 steer 能力
prevent_idle_sleep = true # 防止任务运行时系统空闲睡眠
child_agents_md = true # 子代理读取/继承 AGENTS.md 规则
collaboration_modes = true # 启用协作模式能力
fast_mode = true # 启用快速模式
image_detail_original = true # 允许按原始细节读取图片
memories = true # 启用记忆能力

[agents] # 子代理全局配置
max_threads = 12 # 最大并行代理线程数
max_depth = 2 # 子代理递归派生最大深度

[agents.default] # 默认通用代理
description = "General-purpose helper." # 代理用途说明
model = "gpt-5.5" # 默认代理模型
model_reasoning_effort = "high" # 默认代理推理强度

[agents.worker] # 执行型代理
description = "Execution-focused role for implementation and fixes." # 负责实现和修复
model = "gpt-5.5" # worker 使用的模型
model_reasoning_effort = "high" # worker 推理强度

[agents.explorer] # 探索型代理
description = "Fast codebase explorer for read-heavy tasks." # 负责代码库阅读和定位
model = "gpt-5.5" # explorer 使用的模型
model_reasoning_effort = "high" # explorer 推理强度
sandbox_mode = "read-only" # explorer 只读沙箱

[agents.awaiter] # 等待/监控型代理
description = "Long-running command and task monitoring role." # 负责长任务监控
model = "gpt-5.5" # awaiter 使用的模型
model_reasoning_effort = "medium" # awaiter 推理强度

[agents.reviewer] # 审查型代理
description = "Reviewer agent for code reviews and feedback." # 负责代码审查和反馈
model = "gpt-5.5" # reviewer 使用的模型
model_reasoning_effort = "xhigh" # reviewer 推理强度

[tui] # 终端 UI 配置
show_tooltips = false # 是否显示工具提示
status_line = ["model-with-reasoning", "current-dir", "run-state", "context-remaining", "context-window-size", "total-input-tokens", "total-output-tokens", "fast-mode"] # 状态栏展示项


